<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232327" />
      <stop offset="1" stop-color="#131316" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b8ff0" />
      <stop offset="1" stop-color="#5b6cd8" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- browser chrome -->
  <rect x="0" y="0" width="800" height="36" fill="#1a1a1d" />
  <circle cx="20" cy="18" r="5" fill="#3f3f46" />
  <circle cx="38" cy="18" r="5" fill="#3f3f46" />
  <circle cx="56" cy="18" r="5" fill="#3f3f46" />
  <rect x="90" y="10" width="260" height="16" rx="8" fill="#28282c" />

  <!-- sidebar -->
  <rect x="0" y="36" width="140" height="414" fill="#1c1c1f" />
  <rect x="24" y="64" width="92" height="10" rx="5" fill="#3f3f46" />
  <rect x="24" y="100" width="72" height="8" rx="4" fill="#2f2f34" />
  <rect x="24" y="126" width="72" height="8" rx="4" fill="#2f2f34" />
  <rect x="24" y="152" width="72" height="8" rx="4" fill="#2f2f34" />
  <rect x="24" y="178" width="72" height="8" rx="4" fill="#2f2f34" />

  <!-- main content: stat cards -->
  <rect x="172" y="64" width="176" height="88" rx="10" fill="#232327" stroke="#2f2f34" />
  <rect x="192" y="84" width="64" height="8" rx="4" fill="#3f3f46" />
  <rect x="192" y="104" width="100" height="18" rx="4" fill="url(#accent)" opacity="0.85" />

  <rect x="364" y="64" width="176" height="88" rx="10" fill="#232327" stroke="#2f2f34" />
  <rect x="384" y="84" width="64" height="8" rx="4" fill="#3f3f46" />
  <rect x="384" y="104" width="80" height="18" rx="4" fill="#4b4b52" />

  <rect x="556" y="64" width="180" height="88" rx="10" fill="#232327" stroke="#2f2f34" />
  <rect x="576" y="84" width="64" height="8" rx="4" fill="#3f3f46" />
  <rect x="576" y="104" width="90" height="18" rx="4" fill="#4b4b52" />

  <!-- chart panel -->
  <rect x="172" y="172" width="564" height="188" rx="10" fill="#1e1e21" stroke="#2f2f34" />
  <rect x="192" y="192" width="140" height="10" rx="5" fill="#3f3f46" />
  <polyline points="192,320 250,290 308,300 366,260 424,275 482,225 540,245 598,200 656,215 714,180"
    fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- list rows -->
  <rect x="172" y="376" width="564" height="14" rx="7" fill="#232327" />
  <rect x="172" y="398" width="564" height="14" rx="7" fill="#1e1e21" />
  <rect x="172" y="420" width="420" height="14" rx="7" fill="#1e1e21" />
</svg>
